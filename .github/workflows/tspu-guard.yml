name: tspu-guard

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tspu-guard
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Xray
        id: cache-xray
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/xray
          key: xray-26.3.27-${{ runner.os }}-${{ runner.arch }}

      - name: Install Xray
        if: steps.cache-xray.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/XTLS/Xray-install/raw/main/install-release.sh \
            | sudo bash -s -- install --version 26.3.27
          xray version | head -1

      - name: Verify Xray
        run: xray version | head -1

      - name: Install Xray geo assets
        run: |
          sudo mkdir -p /usr/local/share/xray
          sudo curl -fsSL -o /usr/local/share/xray/geosite.dat https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat
          sudo curl -fsSL -o /usr/local/share/xray/geoip.dat https://github.com/v2fly/geoip/releases/latest/download/geoip.dat
          ls -l /usr/local/share/xray/

      - name: Guard
        env:
          TG_TOKEN:      ${{ secrets.TG_TOKEN }}
          TG_CHAT:       ${{ secrets.TG_CHAT }}
          CLIENT_JSON:   ${{ secrets.CLIENT_JSON }}
          DOMAIN:        ${{ secrets.DOMAIN }}
          EXPECT_EXIT:   ${{ secrets.EXPECT_EXIT }}
          TUNNEL_DOMAIN: ${{ secrets.TUNNEL_DOMAIN }}
          # TUNNEL_PORT: ${{ vars.TUNNEL_PORT }}   # если порт не 443
        run: python3 scripts/tspu_guard.py
