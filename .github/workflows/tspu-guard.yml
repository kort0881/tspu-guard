name: tspu-guard

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tspu-guard
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Xray
        id: cache-xray
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/xray
          key: xray-26.3.27-${{ runner.os }}-${{ runner.arch }}

      - name: Install Xray
        if: steps.cache-xray.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/XTLS/Xray-install/raw/main/install-release.sh \
            | sudo bash -s -- install --version 26.3.27
          xray version | head -1

      - name: Verify Xray
        run: xray version | head -1

      - name: Debug tunnel DNS
        env:
          CLIENT_JSON:   ${{ secrets.CLIENT_JSON }}
          TUNNEL_DOMAIN: ${{ secrets.TUNNEL_DOMAIN }}
        run: |
          echo "$CLIENT_JSON" > /tmp/c.json
          xray run -c /tmp/c.json > /tmp/xray.log 2>&1 &
          sleep 6

          echo "--- порт SOCKS ---"
          ss -lntp | grep 10808 || echo "порт 10808 не слушается"
          echo "--- хвост лога xray ---"
          tail -20 /tmp/xray.log || true

          echo "--- curl -v к https://$TUNNEL_DOMAIN через SOCKS ---"
          curl -v --max-time 20 --socks5-hostname 127.0.0.1:10808 \
            "https://${TUNNEL_DOMAIN}/" 2>&1 | head -50 || true

          echo "--- для сравнения: резолв $TUNNEL_DOMAIN напрямую ---"
          getent hosts "${TUNNEL_DOMAIN}" || echo "напрямую не резолвится"

          echo "--- реальный IP через туннель ---"
          curl -sS --max-time 20 --socks5-hostname 127.0.0.1:10808 \
            https://api.ipify.org || true
          echo

          kill %1 2>/dev/null || true

      - name: Guard
        env:
          TG_TOKEN:      ${{ secrets.TG_TOKEN }}
          TG_CHAT:       ${{ secrets.TG_CHAT }}
          CLIENT_JSON:   ${{ secrets.CLIENT_JSON }}
          DOMAIN:        ${{ secrets.DOMAIN }}
          EXPECT_EXIT:   ${{ secrets.EXPECT_EXIT }}
          TUNNEL_DOMAIN: ${{ secrets.TUNNEL_DOMAIN }}
        run: python3 scripts/tspu_guard.py
