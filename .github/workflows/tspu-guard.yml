name: tspu-guard

on:
  schedule:
    - cron: '*/30 * * * *'      # каждые 30 минут
  workflow_dispatch:            # можно запустить вручную

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Установить Xray (пин версии)
        run: |
          curl -fsSL https://github.com/XTLS/Xray-install/raw/main/install-release.sh \
            | sudo bash -s -- install --version 26.3.27
          xray version | head -1

      - name: Установить dig
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils

      - name: Сторож
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT:  ${{ secrets.TG_CHAT }}
          CLIENT_JSON: ${{ secrets.CLIENT_JSON }}
          DOMAIN: ${{ secrets.DOMAIN }}
          EXPECT_EXIT: ${{ secrets.EXPECT_EXIT }}
          TUNNEL_DOMAIN: ${{ secrets.TUNNEL_DOMAIN }}
        run: python3 scripts/tspu_guard.py
